name: FeedbackTrace CI

on:
  push:
    branches: [main, feature/task-a-feedback-intelligence, feature/task-b-decision-intelligence]
    paths:
      - "ai-service/**"
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/migrations/**"
      - "docs/**"
      - "resources/**"
      - "routes/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python Task A and Task B tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115,<1" "pydantic-settings>=2.4" "groq>=0.11" "pytest>=8" "httpx>=0.27"
      - name: Run Task A and Task B tests
        working-directory: ai-service
        env:
          PYTHONPATH: .
        run: python -m pytest tests/task_a tests/task_b -q

  frontend:
    name: Vite frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  php-syntax:
    name: PHP syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Lint PHP source and tests
        run: |
          find app bootstrap config database routes tests -type f -name "*.php" -print0 | xargs -0 -n1 php -l
