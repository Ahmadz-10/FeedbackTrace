name: Shared Dashboard UI

on:
  push:
    branches:
      - develop
    paths:
      - "resources/views/**"
      - "resources/css/app.css"
      - "resources/js/app.js"
      - "routes/web.php"
      - "tests/Feature/SharedDashboardTest.php"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/shared-dashboard-ci.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "resources/views/**"
      - "resources/css/app.css"
      - "resources/js/app.js"
      - "routes/web.php"
      - "tests/Feature/SharedDashboardTest.php"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard routes, tests, and asset build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, curl, dom, fileinfo, intl, xml
          coverage: none
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Configure test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Test shared dashboard pages
        run: php artisan test --filter=SharedDashboardTest
